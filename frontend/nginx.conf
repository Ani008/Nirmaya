server {
  listen 80;
  # HTTPS with a self-signed certificate (made when the image is built).
  # Phones only allow the microphone on https:// or localhost, so a phone on the same Wi-Fi
  # must use https://<laptop-ip>:8443.
  listen 443 ssl;
  ssl_certificate /etc/nginx/certs/nirmaya.crt;
  ssl_certificate_key /etc/nginx/certs/nirmaya.key;

  root /usr/share/nginx/html;
  index index.html;

  # Voice recordings are uploaded through here
  client_max_body_size 20m;

  # /api/voice -> backend:5000/voice  (the trailing slash strips "/api")
  location /api/ {
    proxy_pass http://backend:5000/;
    proxy_set_header Host $host;
    proxy_read_timeout 90s;
  }

  location / {
    try_files $uri /index.html;
  }
}
