server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Voice recordings are uploaded through here
  client_max_body_size 20m;

  # /api/voice -> backend:5000/voice  (the trailing slash strips "/api")
  location /api/ {
    proxy_pass http://backend:5000/;
    proxy_set_header Host $host;
    proxy_read_timeout 90s;
  }

  location / {
    try_files $uri /index.html;
  }
}
