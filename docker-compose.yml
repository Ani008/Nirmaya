# Start everything with:  docker compose up --build
# Then open http://localhost:8080   (this laptop)
#       or  https://<this-laptop-ip>:8443   (a phone on the same Wi-Fi; accept the certificate warning once)
#
# No setup is needed to start. To enable voice understanding, create backend/.env
# (copy backend/.env.example) and set GEMINI_API_KEY. Without it the app still saves every
# recording in backend/uploads and shows "key not set".
services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - backend
    restart: unless-stopped
